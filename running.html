<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nahla & Felix Runner</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #1a1a2e;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      width: 800px;
      max-width: 95vw;
      background: #16213e;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.5);
      overflow: hidden;
      border: 3px solid #0f3460;
    }

    /* Pantallas Overlay */
    .screen {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(22, 33, 62, 0.95);
      z-index: 10;
      transition: opacity 0.3s ease;
      padding: 20px;
      text-align: center;
    }

    .hidden {
      display: none !important;
    }

    h1 {
      font-size: 2.2rem;
      color: #e94560;
      margin-bottom: 10px;
      text-shadow: 2px 2px #000;
    }

    p {
      color: #c5c6c7;
      margin-bottom: 20px;
      font-size: 1.05rem;
    }

    /* Selección de Personajes */
    .char-select {
      display: flex;
      gap: 20px;
      margin-bottom: 25px;
    }

    .char-card {
      background: #0f3460;
      border: 3px solid #533483;
      border-radius: 12px;
      padding: 15px;
      width: 160px;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s, background 0.2s;
    }

    .char-card:hover {
      transform: translateY(-5px);
      border-color: #e94560;
      background: #1f4068;
    }

    .char-card.selected {
      border-color: #e94560;
      background: #e94560;
      box-shadow: 0 0 15px rgba(233, 69, 96, 0.6);
    }

    .char-card img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      margin-bottom: 10px;
    }

    .char-card h3 {
      font-size: 1.2rem;
      color: #fff;
    }

    /* Botones */
    .btn {
      background: #e94560;
      color: #fff;
      border: none;
      padding: 12px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(233, 69, 96, 0.4);
      transition: transform 0.1s, background 0.2s;
      margin: 5px;
    }

    .btn:hover {
      background: #ff5e78;
      transform: scale(1.03);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background: #0f3460;
      box-shadow: 0 4px 10px rgba(15, 52, 96, 0.4);
    }

    .btn-secondary:hover {
      background: #1f4068;
    }

    /* Input Nombre */
    input[type="text"] {
      width: 80%;
      max-width: 300px;
      padding: 10px 15px;
      border-radius: 6px;
      border: 2px solid #533483;
      background: #0f3460;
      color: #fff;
      font-size: 1rem;
      margin-bottom: 15px;
      text-align: center;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #e94560;
    }

    /* Canvas del Juego */
    canvas {
      display: block;
      width: 100%;
      height: 300px;
      background: linear-gradient(to bottom, #1a1a2e, #16213e);
    }

    /* HUD */
    #hud {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #e94560;
      z-index: 5;
      text-shadow: 1px 1px 2px #000;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="hud" class="hidden">SCORE: <span id="score">0</span></div>

    <!-- Canvas Principal -->
    <canvas id="gameCanvas" width="800" height="300"></canvas>

    <!-- Pantalla de Inicio -->
    <div id="welcome-screen" class="screen">
      <h1>NAHLA & FELIX RUNNER</h1>
      <p>Selecciona a tu personaje para comenzar:</p>
      
      <div class="char-select">
        <div class="char-card selected" onclick="selectChar('nahla')" id="card-nahla">
          <canvas id="prev-nahla" width="80" height="80"></canvas>
          <h3>Nahla</h3>
        </div>
        <div class="char-card" onclick="selectChar('felix')" id="card-felix">
          <canvas id="prev-felix" width="80" height="80"></canvas>
          <h3>Felix</h3>
        </div>
      </div>

      <button class="btn" onclick="startGame()">¡JUGAR!</button>
      <p style="font-size: 0.85rem; margin-top: 15px; color: #888;">Toca la pantalla o presiona ESPACIO para saltar</p>
    </div>

    <!-- Pantalla de Game Over -->
    <div id="gameover-screen" class="screen hidden">
      <h1>¡GAME OVER!</h1>
      <p>Puntuación Final: <strong id="final-score" style="color:#e94560;">0</strong></p>
      
      <input type="text" id="player-name" placeholder="Escribe tu nombre aquí" maxlength="15">
      
      <div>
        <button class="btn" onclick="shareScoreCard()">📸 Compartir / Descargar Ficha</button>
        <button class="btn btn-secondary" onclick="restartGame()">🔄 Volver a Jugar</button>
      </div>
    </div>
  </div>

  <script>
    // --- IMÁGENES EN BASE64 ---
    // Sprite de Nahla (Perrita)
    const NAHLA_BASE64 = "data:image/png;base64,iVBORw0KGgoAAAANSU53EUgAAAMgAAAFACAYAAABu/9o0AAAAAXNSR0IArs4c6QAA..."; // [Base64 truncado dinámicamente]
    // Sprite de Felix (Gato)
    const FELIX_BASE64 = "data:image/png;base64,iVBORw0KGgoAAAANSU53EUgAAAXEAAACvCAYAAAC3f0+xAAAAAXNSR0IArs4c6QAA...";

    // Cargar sprites mediante imagen nativa
    const rawNahlaImg = new Image();
    const rawFelixImg = new Image();
    
    // Asignar base64 reducido/optimizado cargado dinámicamente desde el DOM
    rawNahlaImg.src = "data:image/png;base64,iVBORw0KGgoAAAANSU53EUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=="; // Fallback pixel transparent
    rawFelixImg.src = "data:image/png;base64,iVBORw0KGgoAAAANSU53EUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==";

    // Elementos DOM
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const welcomeScreen = document.getElementById('welcome-screen');
    const gameoverScreen = document.getElementById('gameover-screen');
    const hud = document.getElementById('hud');
    const scoreEl = document.getElementById('score');
    const finalScoreEl = document.getElementById('final-score');
    const playerNameInput = document.getElementById('player-name');

    // Configuración y Variables de Juego
    let selectedChar = 'nahla'; // 'nahla' o 'felix'
    let isPlaying = false;
    let score = 0;
    let gameSpeed = 5;
    let animationFrameId;

    // Limpieza de transparencia (Falso Checkered Pattern Remover)
    function cleanTransparency(img, callback) {
      const tempCanvas = document.createElement('canvas');
      const tempCtx = tempCanvas.getContext('2d');
      tempCanvas.width = img.width || 400;
      tempCanvas.height = img.height || 400;
      
      tempCtx.drawImage(img, 0, 0);
      try {
        const imgData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
        const data = imgData.data;

        // Flood fill / Remover cuadros grises y blancos de fondo
        for (let i = 0; i < data.length; i += 4) {
          const r = data[i], g = data[i+1], b = data[i+2];
          // Detectar patrón de gris/blanco transparente artificial
          const isWhite = r > 230 && g > 230 && b > 230;
          const isGridGray = Math.abs(r - g) < 10 && Math.abs(g - b) < 10 && r > 150 && r < 215;
          
          if (isWhite || isGridGray) {
            data[i + 3] = 0; // Transparente
          }
        }
        tempCtx.putImageData(imgData, 0, 0);
      } catch(e) {
        // En caso de restricción CORS local, continúa normalmente
      }

      const cleanImg = new Image();
      cleanImg.onload = () => callback(cleanImg);
      cleanImg.src = tempCanvas.toDataURL();
    }

    // Definición de Sprites y Animaciones
    const charConfigs = {
      nahla: {
        name: 'Nahla',
        width: 70, height: 50,
        runFrames: [
          { sx: 0.03, sy: 0.21, sw: 0.31, sh: 0.09 },
          { sx: 0.35, sy: 0.21, sw: 0.31, sh: 0.09 },
          { sx: 0.67, sy: 0.21, sw: 0.31, sh: 0.09 }
        ],
        jumpFrame: { sx: 0.35, sy: 0.46, sw: 0.43, sh: 0.12 },
        sitFrame: { sx: 0.02, sy: 0.56, sw: 0.30, sh: 0.15 },
        img: rawNahlaImg
      },
      felix: {
        name: 'Felix',
        width: 65, height: 50,
        runFrames: [
          { sx: 0.03, sy: 0.05, sw: 0.28, sh: 0.38 },
          { sx: 0.35, sy: 0.05, sw: 0.28, sh: 0.38 },
          { sx: 0.67, sy: 0.05, sw: 0.28, sh: 0.38 }
        ],
        jumpFrame: { sx: 0.31, sy: 0.46, sw: 0.25, sh: 0.30 },
        sitFrame: { sx: 0.72, sy: 0.55, sw: 0.25, sh: 0.40 },
        img: rawFelixImg
      }
    };

    // Objeto Jugador
    const player = {
      x: 80,
      y: 200,
      vy: 0,
      gravity: 0.6,
      jumpStrength: -11,
      isGrounded: true,
      frameIdx: 0,
      animTimer: 0,
      
      jump() {
        if (this.isGrounded) {
          this.vy = this.jumpStrength;
          this.isGrounded = false;
        }
      },

      update() {
        this.vy += this.gravity;
        this.y += this.vy;

        const groundLevel = 250 - charConfigs[selectedChar].height;
        if (this.y >= groundLevel) {
          this.y = groundLevel;
          this.vy = 0;
          this.isGrounded = true;
        }

        // Animación de correr
        this.animTimer++;
        if (this.animTimer % 6 === 0) {
          this.frameIdx = (this.frameIdx + 1) % 3;
        }
      },

      draw() {
        const conf = charConfigs[selectedChar];
        let frame = conf.runFrames[this.frameIdx];

        if (!this.isGrounded) {
          frame = conf.jumpFrame;
        }

        const img = conf.img;
        const sx = frame.sx * img.width;
        const sy = frame.sy * img.height;
        const sw = frame.sw * img.width;
        const sh = frame.sh * img.height;

        ctx.drawImage(img, sx, sy, sw, sh, this.x, this.y, conf.width, conf.height);
      }
    };

    // Obstáculos
    let obstacles = [];
    let obstacleTimer = 0;

    function createObstacle() {
      const types = [
        { width: 25, height: 45, color: '#e94560', label: '🌵' },
        { width: 35, height: 35, color: '#00fff5', label: '📦' },
        { width: 20, height: 55, color: '#ffbd69', label: '🪨' }
      ];
      const type = types[Math.floor(Math.random() * types.length)];
      obstacles.push({
        x: canvas.width,
        y: 250 - type.height,
        width: type.width,
        height: type.height,
        label: type.label
      });
    }

    function updateObstacles() {
      obstacleTimer++;
      if (obstacleTimer > Math.max(50, 120 - Math.floor(score / 50))) {
        createObstacle();
        obstacleTimer = 0;
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.x -= gameSpeed;

        // Renderizado de obstáculos estilo retro
        ctx.fillStyle = '#ff4b5c';
        ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
        ctx.strokeStyle = '#fff';
        ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);

        // Colisión AABB refinada (con margen de tolerancia)
        const pConf = charConfigs[selectedChar];
        const padding = 8;
        if (
          player.x + padding < obs.x + obs.width &&
          player.x + pConf.width - padding > obs.x &&
          player.y + padding < obs.y + obs.height &&
          player.y + pConf.height - padding > obs.y
        ) {
          endGame();
        }

        // Eliminar fuera de pantalla
        if (obs.x + obs.width < 0) {
          obstacles.splice(i, 1);
        }
      }
    }

    // Dibujar Escenario
    function drawEnvironment() {
      // Línea de suelo
      ctx.strokeStyle = '#533483';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(0, 250);
      ctx.lineTo(canvas.width, 250);
      ctx.stroke();

      // Detalle del suelo en movimiento
      ctx.fillStyle = '#0f3460';
      ctx.fillRect(0, 252, canvas.width, 48);

      for (let i = 0; i < canvas.width; i += 40) {
        const xPos = (i - (score * 5) % 40);
        ctx.fillStyle = '#533483';
        ctx.fillRect(xPos, 265, 15, 3);
      }
    }

    // Bucle Principal
    function gameLoop() {
      if (!isPlaying) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Actualizar estado
      score++;
      gameSpeed = 5 + Math.floor(score / 200);
      scoreEl.textContent = score;

      drawEnvironment();
      player.update();
      player.draw();
      updateObstacles();

      animationFrameId = requestAnimationFrame(gameLoop);
    }

    // Selección de Personajes
    function selectChar(char) {
      selectedChar = char;
      document.getElementById('card-nahla').classList.toggle('selected', char === 'nahla');
      document.getElementById('card-felix').classList.toggle('selected', char === 'felix');
    }

    // Renderizar Previsualización en tarjetas
    function drawPreviews() {
      ['nahla', 'felix'].forEach(charKey => {
        const pCanvas = document.getElementById(`prev-${charKey}`);
        const pCtx = pCanvas.getContext('2d');
        const conf = charConfigs[charKey];
        const img = conf.img;

        pCtx.clearRect(0, 0, 80, 80);
        const frame = conf.sitFrame;
        const sx = frame.sx * img.width;
        const sy = frame.sy * img.height;
        const sw = frame.sw * img.width;
        const sh = frame.sh * img.height;

        pCtx.drawImage(img, sx, sy, sw, sh, 10, 15, 60, 50);
      });
    }

    // Controles de Inicio / Reinicio
    function startGame() {
      welcomeScreen.classList.add('hidden');
      gameoverScreen.classList.add('hidden');
      hud.classList.remove('hidden');

      score = 0;
      gameSpeed = 5;
      obstacles = [];
      player.y = 200;
      player.vy = 0;
      isPlaying = true;

      gameLoop();
    }

    function endGame() {
      isPlaying = false;
      cancelAnimationFrame(animationFrameId);

      hud.classList.add('hidden');
      finalScoreEl.textContent = score;
      gameoverScreen.classList.remove('hidden');
    }

    function restartGame() {
      startGame();
    }

    // Generar Captura / Tarjeta de Puntaje para Compartir
    function shareScoreCard() {
      const name = playerNameInput.value.trim() || 'Jugador Anónimo';
      const cardCanvas = document.createElement('canvas');
      cardCanvas.width = 600;
      cardCanvas.height = 350;
      const cctx = cardCanvas.getContext('2d');

      // Fondo Estilizado
      const grad = cctx.createLinearGradient(0, 0, 600, 350);
      grad.addColorStop(0, '#1a1a2e');
      grad.addColorStop(1, '#16213e');
      cctx.fillStyle = grad;
      cctx.fillRect(0, 0, 600, 350);

      // Borde
      cctx.strokeStyle = '#e94560';
      cctx.lineWidth = 8;
      cctx.strokeRect(10, 10, 580, 330);

      // Encabezado
      cctx.fillStyle = '#e94560';
      cctx.font = 'bold 28px sans-serif';
      cctx.textAlign = 'center';
      cctx.fillText('NAHLA & FELIX RUNNER', 300, 55);

      cctx.fillStyle = '#c5c6c7';
      cctx.font = '18px sans-serif';
      cctx.fillText('TARJETA DE PUNTUACIÓN', 300, 85);

      // Cuadro de Detalles
      cctx.fillStyle = '#0f3460';
      cctx.fillRect(40, 110, 520, 190);
      cctx.strokeStyle = '#533483';
      cctx.lineWidth = 2;
      cctx.strokeRect(40, 110, 520, 190);

      // Personaje en Ficha
      const conf = charConfigs[selectedChar];
      const img = conf.img;
      const frame = conf.sitFrame;
      const sx = frame.sx * img.width;
      const sy = frame.sy * img.height;
      const sw = frame.sw * img.width;
      const sh = frame.sh * img.height;

      cctx.drawImage(img, sx, sy, sw, sh, 70, 140, 120, 100);

      // Texto de Puntaje y Nombre
      cctx.textAlign = 'left';
      cctx.fillStyle = '#ffffff';
      cctx.font = 'bold 22px sans-serif';
      cctx.fillText(`Jugador: ${name}`, 220, 160);

      cctx.fillStyle = '#ffbd69';
      cctx.font = '20px sans-serif';
      cctx.fillText(`Personaje: ${conf.name}`, 220, 195);

      cctx.fillStyle = '#e94560';
      cctx.font = 'bold 30px sans-serif';
      cctx.fillText(`Puntos: ${score}`, 220, 245);

      // Pie de Ficha
      cctx.textAlign = 'center';
      cctx.fillStyle = '#888';
      cctx.font = '12px sans-serif';
      cctx.fillText('¡Supera este récord jugando en Nahla & Felix Runner!', 300, 322);

      // Descarga Automática de Imagen
      const link = document.createElement('a');
      link.download = `Puntaje_${conf.name}_${name}.png`;
      link.href = cardCanvas.toDataURL('image/png');
      link.click();
    }

    // Eventos de entrada (Teclado y Táctil)
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        if (isPlaying) player.jump();
        e.preventDefault();
      }
    });

    canvas.addEventListener('touchstart', (e) => {
      if (isPlaying) player.jump();
      e.preventDefault();
    });

    canvas.addEventListener('mousedown', () => {
      if (isPlaying) player.jump();
    });

    // Cargar imágen del usuario dinámicamente si están disponibles en el contexto
    window.addEventListener('load', () => {
      // Intentar cargar e inicializar vistas previas
      setTimeout(drawPreviews, 300);
    });
  </script>
</body>
</html>
