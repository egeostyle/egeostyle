<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nahla &amp; Felix Runner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#8fd3f4;
    --sky-bottom:#e2f6ff;
    --ground:#b98a55;
    --ground-dark:#8a6339;
    --accent:#ff8a3d;
    --ink:#2b2140;
    --card:#fff8ee;
    --nahla:#c98a4b;
    --felix:#5b6ee1;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;height:100%;
    font-family:'Baloo 2',system-ui,sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg,var(--sky-top),var(--sky-bottom) 60%);
    overflow:hidden;
    touch-action:manipulation;
    user-select:none;
  }
  #app{
    position:relative;
    width:100%;
    height:100vh;
    max-width:560px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .pixel-title{
    font-family:'Press Start 2P',monospace;
    letter-spacing:1px;
  }
  /* ---------- decorative sky ---------- */
  .cloud{
    position:absolute;
    background:#fff;
    border-radius:50px;
    opacity:.85;
    filter:blur(.3px);
  }
  .sun{
    position:absolute;
    top:22px;right:28px;
    width:54px;height:54px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #fff6cf, #ffd25c 70%);
    box-shadow:0 0 30px 8px rgba(255,210,92,.55);
  }
  /* ---------- screens ---------- */
  .screen{
    position:absolute;inset:0;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:20px;
    transition:opacity .25s ease;
  }
  .screen.hidden{display:none;}

  /* ---------- welcome ---------- */
  #screen-welcome h1{
    font-size:15px;
    text-align:center;
    line-height:1.8;
    margin:0 0 4px;
    color:var(--ink);
    text-shadow:2px 2px 0 rgba(255,255,255,.6);
  }
  #screen-welcome .subtitle{
    margin:0 0 22px;
    font-weight:600;
    opacity:.75;
    font-size:15px;
  }
  .char-grid{
    display:flex;
    gap:16px;
    width:100%;
    max-width:420px;
  }
  .char-card{
    flex:1;
    background:var(--card);
    border:4px solid transparent;
    border-radius:20px;
    padding:14px 10px 16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    cursor:pointer;
    box-shadow:0 6px 0 rgba(0,0,0,.12), 0 8px 18px rgba(0,0,0,.08);
    transition:transform .15s ease, border-color .15s ease;
  }
  .char-card:active{transform:translateY(3px);}
  .char-card.selected{
    border-color:var(--accent);
    transform:translateY(-2px);
  }
  .char-card .thumb-wrap{
    width:100%;
    height:64px;
    display:flex;align-items:flex-end;justify-content:center;
    overflow:visible;
    margin-bottom:10px;
  }
  .char-card .thumb-wrap img{
    image-rendering:pixelated;
    height:56px;
    width:auto;
    max-width:none;
  }
  .char-card .cname{
    font-weight:700;
    font-size:17px;
  }
  .char-card .ctag{
    font-size:11px;
    opacity:.6;
    margin-top:2px;
  }
  .char-card[data-char="nahla"] .cname{color:var(--nahla);}
  .char-card[data-char="felix"] .cname{color:var(--felix);}

  button{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    border:none;
    cursor:pointer;
  }
  .btn-primary{
    margin-top:26px;
    background:var(--accent);
    color:#fff;
    font-size:18px;
    padding:14px 40px;
    border-radius:50px;
    box-shadow:0 6px 0 #c96a20;
    transition:transform .1s ease;
  }
  .btn-primary:active{transform:translateY(4px);box-shadow:0 2px 0 #c96a20;}
  .btn-secondary{
    background:#fff;
    color:var(--ink);
    font-size:14px;
    padding:10px 22px;
    border-radius:40px;
    box-shadow:0 4px 0 rgba(0,0,0,.15);
    margin-top:10px;
  }
  .btn-secondary:active{transform:translateY(3px);box-shadow:none;}
  .hint{
    margin-top:18px;
    font-size:12px;
    opacity:.55;
    text-align:center;
  }

  /* ---------- game screen ---------- */
  #screen-game{padding:0;justify-content:flex-start;}
  #hud{
    position:absolute;top:0;left:0;right:0;
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 18px;
    z-index:5;
    font-family:'Press Start 2P',monospace;
    font-size:12px;
    color:var(--ink);
    text-shadow:1px 1px 0 rgba(255,255,255,.6);
  }
  #hud .best{opacity:.65;font-size:10px;}
  #game-area{
    position:relative;
    width:100%;height:100%;
    overflow:hidden;
  }
  .bg-cloud{
    position:absolute;
    top:0;left:0;
    width:200%;height:60%;
    background-image:
      radial-gradient(30px 18px at 40px 40px, rgba(255,255,255,.8), transparent 70%),
      radial-gradient(24px 14px at 220px 70px, rgba(255,255,255,.7), transparent 70%),
      radial-gradient(34px 20px at 420px 30px, rgba(255,255,255,.75), transparent 70%),
      radial-gradient(26px 16px at 620px 90px, rgba(255,255,255,.7), transparent 70%);
    background-repeat:repeat-x;
    will-change:transform;
  }
  #ground{
    position:absolute;
    left:0;right:0;bottom:0;
    height:22%;
    background:linear-gradient(180deg, var(--ground), var(--ground-dark));
    border-top:4px solid #6f4d27;
  }
  #ground::before{
    content:"";
    position:absolute;top:-4px;left:0;right:0;height:4px;
    background:repeating-linear-gradient(90deg,#e7c98a 0 26px, transparent 26px 40px);
  }
  #player{
    position:absolute;
    left:12%;
    bottom:22%;
    z-index:4;
    display:flex;align-items:flex-end;
  }
  #player img{
    image-rendering:pixelated;
    height:64px;
    width:auto;
    display:block;
  }
  .obstacle{
    position:absolute;
    bottom:22%;
    z-index:3;
    font-size:34px;
    line-height:1;
    filter:drop-shadow(2px 3px 1px rgba(0,0,0,.25));
  }
  #tap-layer{
    position:absolute;inset:0;
    z-index:6;
  }
  #jump-btn{
    position:absolute;
    right:18px;bottom:26%;
    z-index:7;
    width:64px;height:64px;
    border-radius:50%;
    background:rgba(255,255,255,.85);
    box-shadow:0 4px 0 rgba(0,0,0,.15);
    font-size:22px;
    display:flex;align-items:center;justify-content:center;
  }
  #jump-btn:active{transform:translateY(3px);box-shadow:none;}
  #countdown{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    font-family:'Press Start 2P',monospace;
    font-size:46px;
    color:#fff;
    text-shadow:3px 3px 0 rgba(0,0,0,.25);
    z-index:8;
    background:rgba(0,0,0,.08);
  }
  #countdown.hidden{display:none;}

  /* ---------- game over ---------- */
  #screen-gameover .panel{
    background:var(--card);
    border-radius:22px;
    padding:26px 24px 22px;
    width:100%;max-width:380px;
    text-align:center;
    box-shadow:0 10px 26px rgba(0,0,0,.15);
  }
  #screen-gameover h2{
    margin:0 0 4px;
    font-size:14px;
    letter-spacing:1px;
  }
  #go-score{
    font-family:'Press Start 2P',monospace;
    font-size:34px;
    margin:14px 0 4px;
    color:var(--accent);
  }
  #go-best{
    font-size:13px;
    opacity:.65;
    margin-bottom:16px;
  }
  #go-thumb{
    height:70px;width:auto;
    image-rendering:pixelated;
    margin:4px 0 10px;
  }
  #name-input{
    width:100%;
    padding:12px 14px;
    border-radius:12px;
    border:2px solid #e3d5be;
    font-family:'Baloo 2',sans-serif;
    font-size:15px;
    text-align:center;
    margin-bottom:14px;
    outline:none;
  }
  #name-input:focus{border-color:var(--accent);}
  .row-btns{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .btn-share{
    background:var(--felix);
    color:#fff;
    font-size:14px;
    padding:12px 20px;
    border-radius:40px;
    box-shadow:0 4px 0 #3c4bb0;
  }
  .btn-share:active{transform:translateY(3px);box-shadow:none;}

  /* ---------- share modal ---------- */
  #share-modal{
    position:fixed;inset:0;
    background:rgba(20,15,35,.72);
    display:flex;align-items:center;justify-content:center;
    z-index:50;
    padding:20px;
  }
  #share-modal.hidden{display:none;}
  #share-card-wrap{
    background:#fff;
    border-radius:18px;
    padding:14px;
    max-width:340px;
    width:100%;
    text-align:center;
  }
  #share-canvas-img{
    width:100%;
    border-radius:10px;
    display:block;
    margin-bottom:14px;
  }
  #share-modal .row-btns{margin-bottom:6px;}
  .btn-close{
    background:transparent;
    color:var(--ink);
    opacity:.6;
    font-size:13px;
    padding:8px;
  }

  @media (max-height:640px){
    #player img{height:52px;}
    .obstacle{font-size:28px;}
  }
</style>
</head>
<body>
<div id="app">

  <!-- ============ WELCOME ============ -->
  <section id="screen-welcome" class="screen">
    <div class="sun"></div>
    <h1 class="pixel-title">NAHLA &amp; FELIX<br>RUNNER</h1>
    <p class="subtitle">Elige tu personaje</p>
    <div class="char-grid">
      <div class="char-card selected" data-char="nahla">
        <div class="thumb-wrap"><img id="thumb-nahla" src="" alt="Nahla"></div>
        <div class="cname">Nahla</div>
        <div class="ctag" style="display:none;">la gordita</div>
      </div>
      <div class="char-card" data-char="felix">
        <div class="thumb-wrap"><img id="thumb-felix" src="" alt="Felix"></div>
        <div class="cname">Felix</div>
        <div class="ctag" style="display:none;">el gordito</div>
      </div>
    </div>
    <button class="btn-primary" id="btn-play">JUGAR</button>
    <p class="hint">Toca la pantalla, la barra espaciadora o el botón para saltar los obstáculos</p>
  </section>

  <!-- ============ GAME ============ -->
  <section id="screen-game" class="screen hidden">
    <div id="hud">
      <div>PUNTOS: <span id="score">000000</span></div>
      <div class="best">RÉCORD: <span id="best">000000</span></div>
    </div>
    <div id="game-area">
      <div class="bg-cloud" id="bg-cloud"></div>
      <div id="player"><img id="player-img" src="" alt=""></div>
      <div id="ground"></div>
      <div id="tap-layer"></div>
      <div id="countdown" class="hidden">3</div>
    </div>
    <button id="jump-btn">⬆</button>
  </section>

  <!-- ============ GAME OVER ============ -->
  <section id="screen-gameover" class="screen hidden">
    <div class="panel">
      <h2 class="pixel-title">¡PERDISTE!</h2>
      <img id="go-thumb" src="" alt="">
      <div id="go-score">000000</div>
      <div id="go-best">Récord de la partida: <span id="go-best-val">0</span></div>
      <input id="name-input" type="text" maxlength="16" placeholder="Escribe tu nombre">
      <div class="row-btns">
        <button class="btn-primary" id="btn-retry" style="margin-top:0;">JUGAR DE NUEVO</button>
        <button class="btn-share" id="btn-share">📤 COMPARTIR</button>
      </div>
    </div>
  </section>

</div>

<!-- ============ SHARE MODAL ============ -->
<div id="share-modal" class="hidden">
  <div id="share-card-wrap">
    <img id="share-canvas-img" alt="Tu puntaje">
    <div class="row-btns">
      <a class="btn-primary" id="btn-download" style="margin-top:0;text-decoration:none;display:inline-block;">DESCARGAR</a>
      <button class="btn-share" id="btn-webshare">📤 COMPARTIR</button>
    </div>
    <button class="btn-close" id="btn-close-modal">Cerrar</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  // ---------- data URI helpers ----------
  function uri(key){ return "data:image/png;base64," + window.SPRITES[key]; }

  var CHARACTERS = {
    nahla: {
      name: "Nahla",
      walk: [uri("dog_walk1"), uri("dog_walk2"), uri("dog_walk3")],
      jump: uri("dog_jump"),
      crouch: uri("dog_crouch"),
      sit: uri("dog_sit"),
      obstacles: ["🦴", "🪵", "🧱"],
      theme: "#c98a4b"
    },
    felix: {
      name: "Felix",
      walk: [uri("cat_walk1"), uri("cat_walk2"), uri("cat_walk3")],
      jump: uri("cat_jump"),
      crouch: uri("cat_crouch"),
      sit: uri("cat_sittall"),
      obstacles: ["🧶", "📦", "🪴"],
      theme: "#5b6ee1"
    }
  };

  // ---------- DOM refs ----------
  var screenWelcome = document.getElementById("screen-welcome");
  var screenGame = document.getElementById("screen-game");
  var screenOver = document.getElementById("screen-gameover");

  var charCards = document.querySelectorAll(".char-card");
  var btnPlay = document.getElementById("btn-play");
  var btnRetry = document.getElementById("btn-retry");
  var btnShare = document.getElementById("btn-share");

  var gameArea = document.getElementById("game-area");
  var playerEl = document.getElementById("player");
  var playerImg = document.getElementById("player-img");
  var scoreEl = document.getElementById("score");
  var bestEl = document.getElementById("best");
  var bgCloud = document.getElementById("bg-cloud");
  var jumpBtn = document.getElementById("jump-btn");
  var tapLayer = document.getElementById("tap-layer");
  var countdownEl = document.getElementById("countdown");

  var goThumb = document.getElementById("go-thumb");
  var goScore = document.getElementById("go-score");
  var goBestVal = document.getElementById("go-best-val");
  var nameInput = document.getElementById("name-input");

  var shareModal = document.getElementById("share-modal");
  var shareImg = document.getElementById("share-canvas-img");
  var btnDownload = document.getElementById("btn-download");
  var btnWebshare = document.getElementById("btn-webshare");
  var btnCloseModal = document.getElementById("btn-close-modal");

  // thumbnail previews on welcome screen (animated walk cycle)
  document.getElementById("thumb-nahla").src = CHARACTERS.nahla.walk[0];
  document.getElementById("thumb-felix").src = CHARACTERS.felix.walk[0];
  (function animateThumbs(){
    var frame = 0;
    setInterval(function(){
      frame = (frame + 1) % 3;
      document.getElementById("thumb-nahla").src = CHARACTERS.nahla.walk[frame];
      document.getElementById("thumb-felix").src = CHARACTERS.felix.walk[frame];
    }, 260);
  })();

  // ---------- state ----------
  var selectedChar = "nahla";
  var bestScore = 0;
  var lastResult = null; // {name, score, char}

  charCards.forEach(function(card){
    card.addEventListener("click", function(){
      charCards.forEach(function(c){ c.classList.remove("selected"); });
      card.classList.add("selected");
      selectedChar = card.getAttribute("data-char");
    });
  });

  function showScreen(el){
    [screenWelcome, screenGame, screenOver].forEach(function(s){ s.classList.add("hidden"); });
    el.classList.remove("hidden");
  }

  // ================= GAME ENGINE =================
  var GRAVITY = 2600;      // px/s^2
  var JUMP_VELOCITY = 980; // px/s
  var GROUND_RATIO = 0.22; // matches CSS #ground / bottom offsets

  var state = null;

  function groundPx(){
    return gameArea.clientHeight * GROUND_RATIO;
  }

  function resetState(){
    var c = CHARACTERS[selectedChar];
    state = {
      char: c,
      running: false,
      t: 0,
      speed: 320,          // px/s, world scroll speed
      score: 0,
      playerY: 0,          // 0 = on ground, positive = height above ground
      vy: 0,
      onGround: true,
      squash: 0,           // squash timer after landing
      walkFrame: 0,
      walkTimer: 0,
      obstacles: [],
      spawnTimer: 0,
      nextSpawn: 900,
      cloudX: 0,
      alive: true
    };
    playerImg.src = c.walk[0];
    playerEl.style.left = "12%";
    positionPlayer();
    // clear old obstacle DOM nodes
    gameArea.querySelectorAll(".obstacle").forEach(function(n){ n.remove(); });
    scoreEl.textContent = "000000";
    bestEl.textContent = pad(bestScore);
  }

  function pad(n){
    n = Math.floor(n);
    var s = String(n);
    while (s.length < 6) s = "0" + s;
    return s;
  }

  function positionPlayer(){
    playerEl.style.bottom = (GROUND_RATIO * 100 + "%");
    playerEl.style.transform = "translateY(" + (-state.playerY) + "px)";
  }

  function pickObstacleGlyph(){
    var list = state.char.obstacles;
    return list[Math.floor(Math.random() * list.length)];
  }

  function spawnObstacle(){
    var el = document.createElement("div");
    el.className = "obstacle";
    el.textContent = pickObstacleGlyph();
    el.style.right = "-60px";
    gameArea.appendChild(el);
    state.obstacles.push({ el: el, x: gameArea.clientWidth + 60, passed: false });
  }

  var lastTime = null;
  function loop(ts){
    if (!state || !state.running) return;
    if (lastTime === null) lastTime = ts;
    var dt = Math.min((ts - lastTime) / 1000, 0.05);
    lastTime = ts;

    update(dt);
    render();

    requestAnimationFrame(loop);
  }

  function update(dt){
    state.t += dt;

    // difficulty ramp
    state.speed = Math.min(320 + state.t * 26, 760);

    // score
    state.score += dt * (state.speed / 6);

    // physics
    if (!state.onGround){
      state.vy -= GRAVITY * dt;
      state.playerY += state.vy * dt;
      if (state.playerY <= 0){
        state.playerY = 0;
        state.vy = 0;
        state.onGround = true;
        state.squash = 0.11; // brief crouch frame on landing
      }
    } else if (state.squash > 0){
      state.squash -= dt;
    }

    // walk animation
    state.walkTimer += dt;
    var frameDur = Math.max(0.05, 0.16 - (state.speed - 320) * 0.00012);
    if (state.walkTimer > frameDur){
      state.walkTimer = 0;
      state.walkFrame = (state.walkFrame + 1) % 3;
    }

    // background cloud parallax
    state.cloudX -= state.speed * 0.25 * dt;
    if (state.cloudX < -gameArea.clientWidth) state.cloudX = 0;

    // spawn obstacles
    state.spawnTimer += dt * 1000;
    if (state.spawnTimer > state.nextSpawn){
      state.spawnTimer = 0;
      state.nextSpawn = 900 + Math.random() * 900 - (state.speed - 320) * 0.6;
      state.nextSpawn = Math.max(480, state.nextSpawn);
      spawnObstacle();
    }

    // move obstacles + collision
    var playerRect = getPlayerHitbox();
    for (var i = state.obstacles.length - 1; i >= 0; i--){
      var ob = state.obstacles[i];
      ob.x -= state.speed * dt;
      ob.el.style.right = (gameArea.clientWidth - ob.x) + "px";

      if (ob.x < -80){
        ob.el.remove();
        state.obstacles.splice(i, 1);
        continue;
      }

      var obRect = ob.el.getBoundingClientRect();
      if (rectsOverlap(playerRect, shrink(obRect, 0.28))){
        gameOver();
        return;
      }
    }
  }

  function shrink(r, factor){
    var dx = r.width * factor;
    var dy = r.height * factor;
    return { left: r.left + dx, right: r.right - dx, top: r.top + dy, bottom: r.bottom - dy };
  }

  function getPlayerHitbox(){
    var r = playerImg.getBoundingClientRect();
    return shrink(r, 0.16);
  }

  function rectsOverlap(a, b){
    return a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top;
  }

  function render(){
    scoreEl.textContent = pad(state.score);
    bgCloud.style.transform = "translateX(" + state.cloudX + "px)";
    positionPlayer();

    var img;
    if (!state.onGround){
      img = state.char.jump;
    } else if (state.squash > 0){
      img = state.char.crouch;
    } else {
      img = state.char.walk[state.walkFrame];
    }
    if (playerImg.src !== img) playerImg.src = img;
  }

  function tryJump(){
    if (!state || !state.running) return;
    if (state.onGround){
      state.onGround = false;
      state.vy = JUMP_VELOCITY;
      state.squash = 0;
    }
  }

  function startCountdownThenPlay(){
    resetState();
    showScreen(screenGame);
    var n = 3;
    countdownEl.classList.remove("hidden");
    countdownEl.textContent = n;
    var iv = setInterval(function(){
      n -= 1;
      if (n <= 0){
        clearInterval(iv);
        countdownEl.classList.add("hidden");
        state.running = true;
        lastTime = null;
        requestAnimationFrame(loop);
      } else {
        countdownEl.textContent = n;
      }
    }, 500);
  }

  function gameOver(){
    state.running = false;
    state.alive = false;
    var finalScore = Math.floor(state.score);
    if (finalScore > bestScore) bestScore = finalScore;

    goThumb.src = state.char.sit;
    goScore.textContent = pad(finalScore);
    goBestVal.textContent = pad(bestScore);
    nameInput.value = "";

    lastResult = { score: finalScore, charKey: selectedChar, charName: state.char.name };

    showScreen(screenOver);
  }

  // ---------- input ----------
  tapLayer.addEventListener("pointerdown", function(e){
    e.preventDefault();
    tryJump();
  });
  jumpBtn.addEventListener("pointerdown", function(e){
    e.preventDefault();
    tryJump();
  });
  window.addEventListener("keydown", function(e){
    if (e.code === "Space" || e.code === "ArrowUp"){
      e.preventDefault();
      if (screenGame.classList.contains("hidden")) return;
      tryJump();
    }
  });

  btnPlay.addEventListener("click", startCountdownThenPlay);
  btnRetry.addEventListener("click", startCountdownThenPlay);

  // ================= SHARE CARD =================
  function buildShareCard(name, callback){
    var canvas = document.createElement("canvas");
    var W = 900, H = 600;
    canvas.width = W; canvas.height = H;
    var ctx = canvas.getContext("2d");
    var theme = CHARACTERS[lastResult.charKey].theme;

    // background
    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, "#8fd3f4");
    grad.addColorStop(1, "#eaf7ff");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // ground strip
    ctx.fillStyle = "#b98a55";
    ctx.fillRect(0, H - 90, W, 90);
    ctx.fillStyle = "#8a6339";
    ctx.fillRect(0, H - 90, W, 8);

    // card panel
    roundRect(ctx, 50, 46, W - 100, H - 170, 26);
    ctx.fillStyle = "rgba(255,252,244,0.95)";
    ctx.fill();

    ctx.textAlign = "center";
    ctx.fillStyle = "#2b2140";
    ctx.font = "700 30px 'Baloo 2', sans-serif";
    ctx.fillText("NAHLA & FELIX RUNNER", W/2, 110);

    ctx.font = "700 22px 'Baloo 2', sans-serif";
    ctx.fillStyle = theme;
    ctx.fillText((name || "Jugador") + "  ·  " + lastResult.charName, W/2, 150);

    ctx.font = "700 90px 'Baloo 2', sans-serif";
    ctx.fillStyle = "#ff8a3d";
    ctx.fillText(pad(lastResult.score), W/2, 280);

    ctx.font = "600 20px 'Baloo 2', sans-serif";
    ctx.fillStyle = "#2b2140aa";
    ctx.fillText("PUNTOS", W/2, 310);

    var img = new Image();
    img.onload = function(){
      var h = 150;
      var w = h * (img.width / img.height);
      ctx.drawImage(img, W/2 - w/2, 340, w, h);
      canvas.toBlob(function(blob){
        callback(canvas, blob);
      }, "image/png");
    };
    img.onerror = function(){
      canvas.toBlob(function(blob){ callback(canvas, blob); }, "image/png");
    };
    img.src = CHARACTERS[lastResult.charKey].sit;
  }

  function roundRect(ctx, x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  var lastBlob = null;

  function openShareModal(){
    var name = nameInput.value.trim();
    buildShareCard(name, function(canvas, blob){
      lastBlob = blob;
      var url = canvas.toDataURL("image/png");
      shareImg.src = url;
      btnDownload.href = url;
      btnDownload.download = "nahla-felix-runner-" + pad(lastResult.score) + ".png";
      shareModal.classList.remove("hidden");
    });
  }

  btnShare.addEventListener("click", openShareModal);
  btnCloseModal.addEventListener("click", function(){ shareModal.classList.add("hidden"); });

  btnWebshare.addEventListener("click", function(){
    if (navigator.share && lastBlob){
      var file = new File([lastBlob], "puntaje.png", { type: "image/png" });
      if (navigator.canShare && navigator.canShare({ files: [file] })){
        navigator.share({
          files: [file],
          title: "Nahla & Felix Runner",
          text: "¡Mira mi puntaje en Nahla & Felix Runner!"
        }).catch(function(){});
        return;
      }
    }
    // fallback: trigger download
    btnDownload.click();
  });

  // initial screen
  showScreen(screenWelcome);
})();

</script>
